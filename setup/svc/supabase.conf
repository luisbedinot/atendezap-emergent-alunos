; Self-hosted Supabase-compatible stack under supervisor.
; Installed by setup/install.sh into /etc/supervisor/conf.d/supabase.conf.
; Start order via priority: postgres -> db-init (one-shot) -> gotrue -> postgrest.
; NOTE: only manage these supabase-* programs; never `supervisorctl restart all`.

[program:supabase-postgres]
command=/app/setup/svc/postgres.sh
autostart=true
autorestart=true
startsecs=3
priority=10
stopsignal=INT
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/supabase-postgres.out.log
stderr_logfile=/var/log/supervisor/supabase-postgres.err.log

[program:supabase-db-init]
command=/app/setup/svc/db-init.sh
autostart=true
; Retry a failed bootstrap after dependencies recover; success remains one-shot.
autorestart=unexpected
startsecs=0
exitcodes=0
priority=20
stdout_logfile=/var/log/supervisor/supabase-db-init.out.log
stderr_logfile=/var/log/supervisor/supabase-db-init.err.log

[program:supabase-gotrue]
command=/app/setup/svc/gotrue.sh
autostart=true
autorestart=true
startsecs=5
priority=30
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/supabase-gotrue.out.log
stderr_logfile=/var/log/supervisor/supabase-gotrue.err.log

[program:supabase-postgrest]
command=/app/setup/svc/postgrest.sh
autostart=true
autorestart=true
startsecs=5
priority=40
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/supabase-postgrest.out.log
stderr_logfile=/var/log/supervisor/supabase-postgrest.err.log
